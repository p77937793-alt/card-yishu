<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一水千田｜卡牌示範 v1</title>
<style>
:root{
  --bg:#f4efe4; --paper:#fffaf0; --ink:#2d2a26; --muted:#7a7166; --line:#d9cfbf;
  --water:#2b7bb9; --water2:#d7ebf7; --rice:#5d8f2f; --soil:#b5532d; --gold:#c9962b;
  --role:#8a5a2b; --project:#2b6cb0; --dev:#2f855a; --event:#c05621; --memory:#6b46c1;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--ink)}
button:hover:not(:disabled){border-color:var(--water);color:var(--water)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--water);color:#fff;border-color:var(--water)}
button.primary:hover:not(:disabled){background:#1f6399;color:#fff}
button.danger{color:#b42318;border-color:#f0b8b0}
button.small{padding:3px 8px;font-size:13px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical}
h1,h2,h3{margin:.2em 0 .5em}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:bold;color:#fff}
.b-史料{background:#2f855a}.b-待核{background:#d97706}.b-遊戲化{background:#6b7280}

/* ---------- home ---------- */
.home{max-width:820px;margin:40px auto;padding:0 16px;text-align:center}
.home h1{font-size:40px;letter-spacing:.1em;color:var(--water)}
.home .sub{font-size:18px;color:var(--muted);margin-bottom:24px}
.home .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.home .btns button{font-size:17px;padding:12px 22px}
.home .note{font-size:13px;color:var(--muted);text-align:left;margin-top:28px}

/* ---------- game ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.topbar .title{font-weight:bold;color:var(--water);font-size:18px}
.topbar .spacer{flex:1}
.game{display:grid;grid-template-columns:270px 1fr 300px;gap:12px;padding:12px;align-items:start}
@media (max-width:1100px){.game{grid-template-columns:1fr}}
.proj{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fff}
.proj.done{background:#e8f4ea;border-color:#9fd0a8}
.proj.cur{border:2px solid var(--project);box-shadow:0 0 0 3px #2b6cb022}
.proj.locked{opacity:.55}
.proj .pname{font-weight:bold}
.bar{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--project)}
.need{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.player-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.player-head .pname{font-size:22px;font-weight:bold}
.res-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.res-chip{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 8px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.res-chip .ic{font-size:22px}.res-chip b{font-size:18px}
.res-chip small{font-size:11px;color:var(--muted)}
.section{margin-top:12px}
.section h3{font-size:15px;margin:0 0 6px;color:var(--muted)}
.market{display:flex;gap:10px;flex-wrap:wrap}
.market .slot{display:flex;flex-direction:column;gap:6px;align-items:center}
.others .op{border-bottom:1px dashed var(--line);padding:6px 0}
.others .op.active{background:#eaf3fb;border-radius:6px;padding:6px}
.log{max-height:300px;overflow:auto;font-size:13px;line-height:1.55}
.log div{border-bottom:1px solid #eee;padding:2px 0}
.water-dots{letter-spacing:2px}

/* ---------- card ---------- */
.card{width:210px;height:294px;border-radius:12px;background:var(--paper);border:2px solid var(--c,#999);
  display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 2px 6px #0002;text-align:left;flex:none}
.card .ch{background:var(--c,#999);color:#fff;padding:5px 8px 4px;display:flex;align-items:center;gap:6px}
.card .ch .ty{font-size:10px;opacity:.9;letter-spacing:.05em}
.card .ch .yr{margin-left:auto;font-size:10px;opacity:.9}
.card .cn{font-size:17px;font-weight:bold;padding:4px 8px 0;line-height:1.25}
.card .img{height:72px;margin:4px 8px 0;border-radius:6px;background:#eee center/cover no-repeat;flex:none}
.card .cost{display:flex;gap:3px;flex-wrap:wrap;padding:4px 8px 0;font-size:12px}
.card .cost span{background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 4px}
.card .rule{font-size:12px;line-height:1.45;padding:4px 8px;flex:1;overflow:hidden;white-space:pre-line}
.card .req{font-size:11px;color:#b42318;padding:0 8px}
.card .hist{font-size:10px;line-height:1.4;color:#5b5348;background:#f1e8d6;margin:0 6px 6px;padding:4px 6px;border-radius:6px;max-height:74px;overflow:hidden}
.card .hist .src{display:block;color:var(--muted);margin-top:2px}
.card .st{position:absolute;right:6px;bottom:6px}
.card.big{transform:scale(1.2);transform-origin:top left;margin:0 42px 59px 0}
.nobadge .card .st{display:none}
.card .copies{position:absolute;left:6px;bottom:4px;font-size:10px;color:var(--muted)}
.card.res .bigic{font-size:64px;text-align:center;margin-top:16px}
.card.res .tile{text-align:center;color:var(--muted);font-size:12px}
.card.memory .tn{display:grid;grid-template-columns:1fr;gap:4px;padding:4px 8px;font-size:12px;flex:1}
.card.memory .tn div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.card.memory .tn b{color:var(--memory)}
.card.back{background:var(--c);align-items:center;justify-content:center;color:#fff}
.card.back .bl{font-size:28px;font-weight:bold;letter-spacing:.2em}
.card.back .bs{font-size:12px;margin-top:6px;opacity:.9}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--paper);border-radius:12px;padding:18px;max-width:640px;width:calc(100% - 32px);max-height:90vh;overflow:auto}
.full{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.full .fhead{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#2d2a26;color:#fff;flex-wrap:wrap}
.full .fhead button{background:#ffffff18;color:#fff;border-color:#ffffff40}
.full .fhead button.on{background:#fff;color:#2d2a26}
.full .fbody{flex:1;overflow:auto;padding:14px}
.gallery{display:flex;gap:14px;flex-wrap:wrap}

/* editor */
.ed{display:grid;grid-template-columns:240px 1fr 300px;gap:12px;height:100%}
@media (max-width:1000px){.ed{grid-template-columns:1fr}}
.ed .list{overflow:auto}
.ed .list .it{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:center;border:1px solid transparent}
.ed .list .it:hover{background:#fff}
.ed .list .it.sel{background:#fff;border-color:var(--water)}
.ed .form{overflow:auto}
.ed label{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.ed label input[type=text],.ed label input:not([type]),.ed label select{width:100%}
.ed .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ed .effrow{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px;margin-top:4px}
.ed .effrow input{width:70px}
.ed .effrow input.w{width:140px}
.ed .costgrid{display:flex;gap:6px;flex-wrap:wrap}
.ed .costgrid label{margin:0;display:flex;align-items:center;gap:3px}
.ed .costgrid input{width:52px}
.issues li{margin:4px 0}
.tip{font-size:12px;color:var(--muted);margin-top:2px}

/* print */
.sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto 14px;padding:8mm 10.5mm;display:grid;
  grid-template-columns:repeat(3,63mm);grid-auto-rows:88mm;gap:0;align-content:start;box-shadow:0 2px 8px #0003}
.sheet .card{width:63mm;height:88mm;border-radius:3mm;box-shadow:none;outline:.2mm dashed #999;outline-offset:0}
@media print{
  @page{size:A4;margin:0}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0}
  .sheet{box-shadow:none;margin:0;page-break-after:always}
  .card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2d2a26;color:#fff;padding:8px 16px;border-radius:8px;z-index:99;font-size:14px}
</style>
</head>

<script>
"use strict";
/* ================= 基本設定 ================= */
const LS_KEY = 'yishui-cards-v1';
const TYPES = {
  role:{label:'人物角色卡',short:'角色',color:'var(--role)',hex:'#8a5a2b'},
  project:{label:'公共建設卡',short:'公共建設',color:'var(--project)',hex:'#2b6cb0'},
  dev:{label:'個人發展卡',short:'個人發展',color:'var(--dev)',hex:'#2f855a'},
  event:{label:'歷史事件卡',short:'歷史事件',color:'var(--event)',hex:'#c05621'},
  memory:{label:'今昔對照卡',short:'今昔對照',color:'var(--memory)',hex:'#6b46c1'}
};
const STATUSES = ['史料','待核','遊戲化'];
const STAT_LABEL = {vp:'分數',riceBonus:'每塊水田收成',contribBonus:'投入公共建設每份貢獻分',extraDraw:'每回合多抽資源卡'};
const TARGETS = {self:'自己',all:'每位玩家',others:'其他玩家'};
const EFFECTS = {
  gain:{label:'獲得資源',p:['target','res','n']},
  lose:{label:'失去資源',p:['target','res','n','unless']},
  stat:{label:'增減數值（田、埤塘、分數…）',p:['target','stat','n']},
  draw:{label:'抽資源卡',p:['target','n']},
  income:{label:'每回合固定收入（持續）',p:['res','n']},
  water:{label:'獲得水滴',p:['target','n']},
  waterLoseAll:{label:'失去所有水滴',p:['target','unless']},
  noWater:{label:'本回合不配水',p:[]},
  waterMod:{label:'本回合配水增減',p:['n']},
  projectCost:{label:'目前公共建設需求增加',p:['res','n']},
  contribMult:{label:'本回合貢獻分倍數',p:['n']},
  fieldBonus:{label:'本回合每塊水田多收稻米',p:['n']},
  tradeRatio:{label:'銀行交易比例（持續）',p:['n']},
  note:{label:'只顯示文字（手動處理）',p:['text']}
};

/* ================= 資料載入／儲存 ================= */
const EMBED = JSON.parse(document.getElementById('default-data').textContent);
let DATA;
function clone(o){return JSON.parse(JSON.stringify(o))}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));return true}catch(e){toast('⚠ 無法自動儲存（瀏覽器不允許或容量已滿），請記得匯出 JSON');return false}}
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{lsSet({base:EMBED.meta.stamp,saved:new Date().toISOString(),data:DATA})},300)}
function loadData(){
  const s=lsGet();
  if(s&&s.data&&s.base===EMBED.meta.stamp){DATA=s.data;return null}
  DATA=clone(EMBED);
  if(s&&s.data) return s; // 內建內容換了版本，但瀏覽器裡有舊草稿
  return null;
}
function normalize(){
  DATA.settings=Object.assign({},EMBED.settings,DATA.settings||{});
  DATA.resources=DATA.resources||[];DATA.cards=DATA.cards||[];
  DATA.cards.forEach(c=>{c.effects=c.effects||[];c.cost=c.cost||{};c.requires=c.requires||[];c.copies=c.copies==null?1:c.copies;c.status=c.status||'遊戲化'});
}

/* ================= 小工具 ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function S(){return DATA.settings}
function resById(id){return DATA.resources.find(r=>r.id===id)}
function resName(id){if(id==='water')return '水滴';const r=resById(id);return r?r.name:'（未知資源 '+id+'）'}
function resIcon(id){if(id==='water')return '💧';const r=resById(id);return r?r.icon:'❓'}
function cardById(id){return DATA.cards.find(c=>c.id===id)}
function cardsOf(t){return DATA.cards.filter(c=>c.type===t)}
function statName(s){return STAT_LABEL[s]||s}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function download(name,text,type){const b=new Blob([text],{type:type||'application/octet-stream'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function newId(prefix){let i=1;while(DATA.cards.some(c=>c.id===prefix+i))i++;return prefix+i}

/* ================= 文字產生 ================= */
function effText(e){
  const tg=TARGETS[e.target]||'自己', n=Number(e.n)||0;
  const un=e.unless?`（持有${String(e.unless).split(',').map(s=>statName(s.trim())).join('或')}者不受影響）`:'';
  switch(e.t){
    case 'gain':return `${tg}獲得 ${n} ${resIcon(e.res)}${resName(e.res)}`;
    case 'lose':return `${tg}失去 ${n} ${resIcon(e.res)}${resName(e.res)}${un}`;
    case 'stat':return `${tg}${statName(e.stat)} ${n>=0?'+':''}${n}`;
    case 'draw':return `${tg}抽 ${n} 張資源卡`;
    case 'income':return `每回合開始獲得 ${n} ${resIcon(e.res)}${resName(e.res)}`;
    case 'water':return `${tg}獲得 ${n} 💧水滴`;
    case 'waterLoseAll':return `${tg}失去所有💧水滴${un}`;
    case 'noWater':return '本回合不配水';
    case 'waterMod':return `本回合配水 ${n>=0?'+':''}${n}`;
    case 'projectCost':return `目前公共建設需求 +${n} ${resIcon(e.res)}${resName(e.res)}`;
    case 'contribMult':return `本回合投入公共建設，貢獻分 ×${n}`;
    case 'fieldBonus':return `本回合每塊水田多收 ${n} 🌾`;
    case 'tradeRatio':return `與銀行交易改為 ${n} 換 1`;
    case 'note':return e.text||'';
  }
  return '';
}
function reqText(r){return r.k==='water'?'已通水':`${statName(r.stat)} ≥ ${r.min}`}
function ruleText(c){
  if(c.text&&c.text.trim())return c.text;
  return (c.effects||[]).map(effText).filter(Boolean).join('\n');
}
function costHTML(cost){
  return Object.entries(cost||{}).filter(([k,v])=>v>0).map(([k,v])=>`<span>${resIcon(k)}×${v}</span>`).join('');
}

/* ================= 卡牌外觀 ================= */
function cardHTML(c,opt){
  opt=opt||{};
  const ty=TYPES[c.type]||{label:c.type,hex:'#999'};
  const cls='card '+c.type+(opt.big?' big':'');
  const st=`<span class="badge b-${esc(c.status)} st">${esc(c.status)}</span>`;
  const cp=opt.copies&&c.copies>1?`<span class="copies">×${c.copies} 張</span>`:'';
  const img=c.image?`<div class="img" style="background-image:url('${esc(c.image)}')"></div>`:'';
  if(c.type==='memory'){
    return `<div class="${cls}" style="--c:${ty.hex}">
      <div class="ch"><span class="ty">${ty.label}</span></div>
      <div class="cn">${esc(c.name)}</div>${img}
      <div class="tn"><div><b>昔</b>　${esc(c.then)}</div><div><b>今</b>　${esc(c.now)}</div></div>
      ${c.source?`<div class="hist"><span class="src">出處：${esc(c.source)}</span></div>`:''}${st}${cp}</div>`;
  }
  const cost=costHTML(c.cost);
  const req=(c.requires||[]).length?`<div class="req">需要：${c.requires.map(reqText).join('、')}</div>`:'';
  const water=c.unlockWater?'\n💧 完成即通水':'';
  return `<div class="${cls}" style="--c:${ty.hex}">
    <div class="ch"><span class="ty">${ty.label}</span>${c.year?`<span class="yr">${esc(c.year)}</span>`:''}</div>
    <div class="cn">${esc(c.name)}</div>${img}
    ${cost?`<div class="cost">${c.type==='project'?'需求 ':'花費 '}${cost}</div>`:''}
    ${req}
    <div class="rule">${esc(ruleText(c)+water)}</div>
    ${c.history||c.source?`<div class="hist">${esc(c.history)}${c.source?`<span class="src">出處：${esc(c.source)}</span>`:''}</div>`:''}
    ${st}${cp}</div>`;
}
function resCardHTML(r,opt){
  opt=opt||{};
  return `<div class="card res" style="--c:${esc(r.color)}">
    <div class="ch"><span class="ty">資源卡</span></div>
    <div class="cn">${esc(r.name)}</div>
    <div class="bigic">${esc(r.icon)}</div>
    <div class="tile">產自：${esc(r.tile)}</div>
    <div class="rule"></div>
    ${r.history||r.source?`<div class="hist">${esc(r.history)}${r.source?`<span class="src">出處：${esc(r.source)}</span>`:''}</div>`:''}
    <span class="badge b-${esc(r.status)} st">${esc(r.status)}</span>
    ${opt.copies?`<span class="copies">×${r.copies} 張</span>`:''}</div>`;
}
function backHTML(type){
  const t=TYPES[type];const hex=t?t.hex:'#2b7bb9';const lab=t?t.label:'資源卡';
  return `<div class="card back" style="--c:${hex}"><div class="bl">一水千田</div><div class="bs">${lab}</div></div>`;
}

/* ================= 畫面狀態 ================= */
let VIEW='home';      // home | setup | game | end
let OVER=null;        // null | gallery | editor | print | rules
let G=null;           // 遊戲狀態
let ED={tab:'role',sel:null};
let GAL={tab:'all'};
let PR={types:{role:true,project:true,dev:true,event:true,memory:true,resource:false},copies:true,backs:false,badge:true};
let MODAL=null;       // {html, onOk}

function render(){
  let h='';
  if(VIEW==='home')h=homeHTML();
  else if(VIEW==='setup')h=setupHTML();
  else if(VIEW==='game')h=gameHTML();
  else if(VIEW==='end')h=endHTML();
  if(OVER==='gallery')h+=galleryHTML();
  if(OVER==='editor')h+=editorHTML();
  if(OVER==='print')h+=printHTML();
  if(OVER==='rules')h+=rulesHTML();
  if(MODAL)h+=`<div class="overlay"><div class="modal">${MODAL.html}</div></div>`;
  $('#app').innerHTML=h;
}
function devBtn(){return S().hideDevButton?'':`<button data-act="openEditor">🛠 開發者模式</button>`}

/* ================= 首頁 ================= */
function homeHTML(){
  return `<div class="home">
    <h1>一水千田</h1>
    <div class="sub">桃園大圳水利開發桌遊・卡牌示範程式</div>
    <div class="btns">
      <button class="primary" data-act="goSetup">▶ 開始試玩</button>
      <button data-act="openGallery">🃏 卡牌一覽</button>
      <button data-act="openRules">📖 規則說明</button>
      <button data-act="openPrint">🖨 列印卡牌</button>
      ${devBtn()}
    </div>
    <div class="panel note">
      <b>這是什麼？</b> 實體桌遊的「卡牌系統」數位示範：用來檢查卡牌內容、數值與流程是否合理。六角版圖的地形產出，在這裡簡化成「每回合抽資源卡」。<br>
      <b>內容版本：</b>${esc(DATA.meta.version||'')}　｜　卡牌共 ${DATA.cards.length} 種、${DATA.cards.reduce((s,c)=>s+(+c.copies||0),0)} 張（另有資源卡 ${DATA.resources.reduce((s,r)=>s+(+r.copies||0),0)} 張）<br>
      <b>修改內容：</b>開發者模式${S().hideDevButton?'（目前按鈕已隱藏，按 Ctrl＋Shift＋D 開啟）':''}。修改會自動存在這台電腦的瀏覽器裡；要給組員，請在開發者模式「匯入／匯出」下載 HTML 或 JSON。
    </div></div>`;
}
function rulesHTML(){
  const s=S();
  return `<div class="overlay" data-act="closeOver"><div class="modal" data-stop>
  <h2>📖 試玩規則（依目前設定自動產生）</h2>
  <p><b>目標（半合作）：</b>${s.maxRounds} 回合內，全體一起完成全部 ${cardsOf('project').length} 張公共建設卡。達成後，分數最高的玩家獲勝；${s.failMode==='allLose'?'沒有達成則<b>全體失敗</b>':'沒有達成則<b>全體分數減半</b>'}。</p>
  <p><b>每回合開始：</b>翻開 1 張歷史事件卡，所有人立即套用。若已通水，每人獲得 ${s.baseWater} 💧（上限＝${s.waterCapBase}＋每座埤塘 ${s.waterPerPond}，超過的水會流走）。</p>
  <p><b>輪到你時：</b></p>
  <ol>
   <li><b>收成</b>：抽 ${s.drawPerTurn} 張資源卡。每塊<b>水田</b>用掉 1 💧 收成 🌾（雙期稻作會更多）；每塊<b>旱田</b>（看天田）有 ${Math.round(s.dryChance*100)}% 機會收成 1 🌾。</li>
   <li><b>行動</b>（不限次數、順序）：投入資源到目前的公共建設（每份得 ${s.vpPerContrib} 貢獻分）、向銀行 ${s.bankRatio} 換 1、把資源給其他玩家（代表協商交易）、購買市場上的個人發展卡。</li>
   <li>按「結束回合」。</li>
  </ol>
  <p><b>計分：</b>貢獻分＋卡牌分數＋每塊水田 ${s.vpPerWet} 分。</p>
  <p class="muted">開局：每人抽 ${s.startDraw} 張資源卡、${s.startDry} 塊旱田，並套用角色卡效果。</p>
  <div class="row"><button class="primary" data-act="closeOver">知道了</button></div></div></div>`;
}

/* ================= 開局設定 ================= */
let SETUP={n:3,names:['玩家一','玩家二','玩家三','玩家四'],roles:['random','random','random','random']};
function setupHTML(){
  const roles=cardsOf('role');
  let rows='';
  for(let i=0;i<SETUP.n;i++){
    rows+=`<div class="row" style="margin:6px 0">
      <input data-setup-name="${i}" value="${esc(SETUP.names[i])}" style="width:140px">
      <select data-setup-role="${i}"><option value="random">隨機角色</option>${roles.map(r=>`<option value="${r.id}" ${SETUP.roles[i]===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>`;
  }
  return `<div class="home"><h2>開局設定</h2><div class="panel" style="text-align:left;max-width:460px;margin:auto">
    <div class="row">玩家人數 <select data-setup-n>${[1,2,3,4].map(n=>`<option ${n===SETUP.n?'selected':''}>${n}</option>`).join('')}</select>
    <span class="muted">（1 人＝單人測試）</span></div>${rows}
    ${roles.length<SETUP.n?`<p style="color:#b42318">角色卡只有 ${roles.length} 張，部分玩家將沒有角色。</p>`:''}
    <div class="row" style="margin-top:12px"><button data-act="goHome">返回</button><button class="primary" data-act="startGame">開始遊戲</button></div>
  </div></div>`;
}

/* ================= 遊戲邏輯 ================= */
function log(m){G.log.unshift(`<b>R${G.round}</b> ${m}`);if(G.log.length>150)G.log.pop()}
function cur(){return G.players[G.turn]}
function cap(p){return S().waterCapBase+(p.stats['埤塘']||0)*S().waterPerPond}
function drawRes(n){
  const out=[];
  for(let i=0;i<n;i++){
    const tot=Object.values(G.pool).reduce((a,b)=>a+b,0);
    if(tot<=0)break;
    let x=Math.random()*tot;
    for(const k in G.pool){x-=G.pool[k];if(x<0){G.pool[k]--;out.push(k);break}}
  }
  return out;
}
function give(p,res,n){p.res[res]=(p.res[res]||0)+n;G.pool[res]=Math.max(0,(G.pool[res]||0)-n)}
function pay(p,res,n){n=Math.min(n,p.res[res]||0);p.res[res]-=n;G.pool[res]=(G.pool[res]||0)+n;return n}
function addWater(p,n){const before=p.water;p.water=Math.max(0,Math.min(cap(p),p.water+n));return p.water-before}
function hasAny(p,list){return String(list||'').split(',').map(s=>s.trim()).filter(Boolean).some(s=>(p.stats[s]||0)>0)}
function targets(t,self){if(t==='all')return G.players;if(t==='others')return G.players.filter(p=>p!==self);return self?[self]:G.players}

function applyEffects(effs,self,srcName){
  for(const e of effs||[]){
    const n=Number(e.n)||0;
    switch(e.t){
      case 'gain':targets(e.target,self).forEach(p=>give(p,e.res,n));break;
      case 'lose':targets(e.target,self).forEach(p=>{if(!hasAny(p,e.unless))pay(p,e.res,n)});break;
      case 'stat':targets(e.target,self).forEach(p=>{p.stats[e.stat]=Math.max(0,(p.stats[e.stat]||0)+n)});break;
      case 'draw':targets(e.target,self).forEach(p=>drawRes(n).forEach(r=>p.res[r]=(p.res[r]||0)+1));break;
      case 'income':if(self)self.income[e.res]=(self.income[e.res]||0)+n;break;
      case 'water':targets(e.target,self).forEach(p=>addWater(p,n));break;
      case 'waterLoseAll':targets(e.target,self).forEach(p=>{if(hasAny(p,e.unless)){if(p.stats['輪灌']&&!p.stats['埤塘'])p.water=Math.min(p.water,1)}else p.water=0});break;
      case 'noWater':G.flags.noWater=true;break;
      case 'waterMod':G.flags.waterMod+=n;break;
      case 'projectCost':{const pr=curProject();if(pr){G.extra[pr.id]=G.extra[pr.id]||{};G.extra[pr.id][e.res]=(G.extra[pr.id][e.res]||0)+n}break}
      case 'contribMult':G.flags.contribMult*=n||1;break;
      case 'fieldBonus':G.flags.fieldBonus+=n;break;
      case 'tradeRatio':if(self)self.tradeRatio=n;break;
      case 'note':if(e.text)log('📝 '+esc(e.text));break;
    }
  }
}
function reqOK(p,reqs){
  return (reqs||[]).every(r=>r.k==='water'?G.flowing:(p.stats[r.stat]||0)>=(Number(r.min)||0));
}
function canAfford(p,cost){return Object.entries(cost||{}).every(([k,v])=>(p.res[k]||0)>=v)}

function projects(){return cardsOf('project')}
function curProject(){return projects().find(c=>!G.done.includes(c.id))||null}
function remaining(pr,res){
  const need=(pr.cost[res]||0)+((G.extra[pr.id]||{})[res]||0)-((G.paid[pr.id]||{})[res]||0);
  return Math.max(0,need);
}
function projectResList(pr){const s=new Set([...Object.keys(pr.cost||{}),...Object.keys(G.extra[pr.id]||{})]);return [...s].filter(k=>(pr.cost[k]||0)+((G.extra[pr.id]||{})[k]||0)>0)}
function projectTotals(pr){let need=0,paid=0;projectResList(pr).forEach(r=>{const tot=(pr.cost[r]||0)+((G.extra[pr.id]||{})[r]||0);need+=tot;paid+=Math.min(tot,(G.paid[pr.id]||{})[r]||0)});return {need,paid}}

function startGame(){
  const s=S();
  const pool={};DATA.resources.forEach(r=>pool[r.id]=+r.copies||0);
  const roleIds=shuffle(cardsOf('role').map(c=>c.id));
  const chosen=SETUP.roles.slice(0,SETUP.n).filter(r=>r!=='random');
  G={round:0,turn:0,players:[],pool,done:[],paid:{},extra:{},flowing:false,log:[],event:null,
     flags:{},devDeck:[],market:[],eventDeck:[],harvest:''};
  for(let i=0;i<SETUP.n;i++){
    let rid=SETUP.roles[i];
    if(rid==='random'){rid=roleIds.find(x=>!chosen.includes(x));if(rid)chosen.push(rid)}
    const p={name:SETUP.names[i]||('玩家'+(i+1)),role:rid||null,res:{},water:0,income:{},tradeRatio:null,contrib:0,
      stats:{'旱田':+s.startDry||0,'水田':+s.startWet||0,'埤塘':+s.startPond||0,'聚落':0,vp:0,riceBonus:0,contribBonus:0,extraDraw:0},cards:[]};
    DATA.resources.forEach(r=>p.res[r.id]=0);
    G.players.push(p);
  }
  G.players.forEach(p=>{
    drawRes(+s.startDraw||0).forEach(r=>p.res[r]++);
    const rc=p.role&&cardById(p.role);if(rc)applyEffects(rc.effects,p,rc.name);
  });
  G.devDeck=shuffle(cardsOf('dev').flatMap(c=>Array(Math.max(0,+c.copies||0)).fill(c.id)));
  refillMarket();
  VIEW='game';G.log=[];
  startRound();
}
function refillMarket(){while(G.market.length<(+S().marketSize||3)&&G.devDeck.length)G.market.push(G.devDeck.pop())}
function drawEvent(){
  if(!G.eventDeck.length)G.eventDeck=shuffle(cardsOf('event').flatMap(c=>Array(Math.max(0,+c.copies||0)).fill(c.id)));
  return G.eventDeck.pop()||null;
}
function startRound(){
  G.round++;
  if(G.round>(+S().maxRounds||8)){return endGame()}
  G.flags={noWater:false,waterMod:0,contribMult:1,fieldBonus:0};
  const eid=drawEvent();G.event=eid;
  const ev=eid&&cardById(eid);
  if(ev){log(`📜 事件：<b>${esc(ev.name)}</b>　${esc(ruleText(ev)).replace(/\n/g,'；')}`);applyEffects(ev.effects,null,ev.name)}
  if(G.flowing&&!G.flags.noWater){
    const n=(+S().baseWater||0)+G.flags.waterMod;
    G.players.forEach(p=>addWater(p,n));
    log(`💧 配水：每人 ${n>=0?'+':''}${n}（受埤塘容量限制）`);
  } else if(G.flowing) log('💧 本回合沒有配水');
  G.turn=0;startTurn();
}
function startTurn(){
  const p=cur(),s=S();const got=[];
  drawRes((+s.drawPerTurn||0)+(p.stats.extraDraw||0)).forEach(r=>{p.res[r]++;got.push(resIcon(r))});
  for(const [r,n] of Object.entries(p.income)){give(p,r,n);for(let i=0;i<n;i++)got.push(resIcon(r))}
  let wetRice=0,wetUsed=0;
  for(let i=0;i<(p.stats['水田']||0);i++){
    if(p.water>0){p.water--;wetUsed++;wetRice+=1+(p.stats.riceBonus||0)+G.flags.fieldBonus}
  }
  let dryRice=0;for(let i=0;i<(p.stats['旱田']||0);i++)if(Math.random()<(+s.dryChance||0))dryRice++;
  if(wetRice+dryRice)give(p,'rice',wetRice+dryRice);
  const dryN=p.stats['旱田']||0,wetN=p.stats['水田']||0;
  G.harvest=`抽到 ${got.join('')||'—'}；水田 ${wetUsed}/${wetN} 塊有水，收 ${wetRice} 🌾；看天田 ${dryRice}/${dryN} 塊收成。`;
  log(`▶ <b>${esc(p.name)}</b> 收成：${G.harvest}`);
}
function endTurn(){
  G.turn++;
  if(G.turn>=G.players.length)startRound();else startTurn();
  render();
}
function contribute(res){
  const p=cur(),pr=curProject();if(!pr)return;
  if((p.res[res]||0)<1||remaining(pr,res)<1)return;
  pay(p,res,1);
  G.paid[pr.id]=G.paid[pr.id]||{};G.paid[pr.id][res]=(G.paid[pr.id][res]||0)+1;
  const pts=((+S().vpPerContrib||0)+(p.stats.contribBonus||0))*G.flags.contribMult;
  p.contrib+=pts;
  if(projectResList(pr).every(r=>remaining(pr,r)<=0)){
    G.done.push(pr.id);
    log(`🏗 公共建設完成：<b>${esc(pr.name)}</b>`);
    applyEffects(pr.effects,p,pr.name);
    if(pr.unlockWater&&!G.flowing){G.flowing=true;log('💧 <b>通水了！</b>從下一回合開始配水。');toast('💧 通水了！')}
    if(!curProject()){log('🎉 全部公共建設完成，共同目標達成！');toast('🎉 共同目標達成！')}
  }
  render();
}
function bankTrade(){
  const p=cur();const from=$('#tFrom').value,to=$('#tTo').value;const ratio=p.tradeRatio||+S().bankRatio||4;
  if(from===to||(p.res[from]||0)<ratio)return;
  pay(p,from,ratio);give(p,to,1);
  log(`🏦 ${esc(p.name)} 用 ${ratio} ${resIcon(from)} 換 1 ${resIcon(to)}`);render();
}
function giveTo(){
  const p=cur();const r=$('#gRes').value,i=+$('#gTo').value,n=Math.max(1,+$('#gN').value||1);const q=G.players[i];
  if(!q||q===p||(p.res[r]||0)<n)return;
  p.res[r]-=n;q.res[r]=(q.res[r]||0)+n;
  log(`🤝 ${esc(p.name)} 給 ${esc(q.name)} ${n} ${resIcon(r)}`);render();
}
function buy(idx){
  const p=cur();const id=G.market[idx];const c=cardById(id);if(!c)return;
  if(!canAfford(p,c.cost)||!reqOK(p,c.requires))return;
  Object.entries(c.cost||{}).forEach(([k,v])=>pay(p,k,v));
  applyEffects(c.effects,p,c.name);p.cards.push(id);
  G.market.splice(idx,1);refillMarket();
  log(`🛒 ${esc(p.name)} 購買 <b>${esc(c.name)}</b>`);render();
}
function score(p){return {contrib:p.contrib,vp:p.stats.vp||0,wet:(p.stats['水田']||0)*(+S().vpPerWet||0),get total(){return this.contrib+this.vp+this.wet}}}
function endGame(){G.round=Math.min(G.round,+S().maxRounds||8);VIEW='end';render()}

/* ================= 列印 ================= */
function printList(){
  const items=[];
  const push=(html,n,backType)=>{for(let i=0;i<(PR.copies?Math.max(0,n):1);i++)items.push({html,backType})};
  Object.keys(TYPES).forEach(t=>{if(PR.types[t])cardsOf(t).forEach(c=>push(cardHTML(c),+c.copies||0,t))});
  if(PR.types.resource)DATA.resources.forEach(r=>push(resCardHTML(r),+r.copies||0,'resource'));
  return items;
}
function printHTML(){
  const items=printList();
  let pages='';
  for(let i=0;i<items.length;i+=9){
    const chunk=items.slice(i,i+9);
    pages+=`<div class="sheet">${chunk.map(x=>x.html).join('')}</div>`;
    if(PR.backs){ // 背面左右鏡像，雙面列印時對齊
      const backs=chunk.map(x=>backHTML(x.backType));while(backs.length%3)backs.push('<div></div>');
      const mir=[];for(let r=0;r<backs.length;r+=3)mir.push(...backs.slice(r,r+3).reverse());
      pages+=`<div class="sheet">${mir.join('')}</div>`;
    }
  }
  const opts=[...Object.entries(TYPES).map(([k,v])=>[k,v.label]),['resource','資源卡']];
  return `<div class="full"><div class="fhead"><b>🖨 列印卡牌（A4、每頁 9 張、63×88 mm）</b>
    ${opts.map(([k,l])=>`<label><input type="checkbox" data-pr-type="${k}" ${PR.types[k]?'checked':''}> ${l}</label>`).join('')}
    <label><input type="checkbox" data-pr="copies" ${PR.copies?'checked':''}> 依張數重複</label>
    <label><input type="checkbox" data-pr="backs" ${PR.backs?'checked':''}> 加印背面</label>
    <label><input type="checkbox" data-pr="badge" ${PR.badge?'checked':''}> 顯示史料狀態標籤</label>
    <span>共 ${items.length} 張・${Math.ceil(items.length/9)} 頁</span>
    <span style="flex:1"></span><button data-act="doPrint">列印</button><button data-act="closeOver">✕ 關閉</button></div>
    <div class="fbody ${PR.badge?'':'nobadge'}" id="printArea">${pages||'<p>沒有選擇任何卡牌</p>'}</div></div>`;
}

function issues(){
  const out=[];const rids=DATA.resources.map(r=>r.id);
  DATA.cards.forEach(c=>{
    const n=`【${TYPES[c.type]?TYPES[c.type].short:c.type}】${c.name}`;
    if(c.status==='待核')out.push(['warn',`${n}：標為「待核」`+(c.source?`（${c.source}）`:'')]);
    if(c.status==='史料'&&!String(c.source||'').trim())out.push(['err',`${n}：標為史料，但沒有填出處`]);
    Object.keys(c.cost||{}).forEach(k=>{if(c.cost[k]>0&&!rids.includes(k))out.push(['err',`${n}：花費用到不存在的資源 ${k}`])});
    (c.effects||[]).forEach(e=>{if(e.res&&!rids.includes(e.res)&&EFFECTS[e.t]&&EFFECTS[e.t].p.includes('res'))out.push(['err',`${n}：效果用到不存在的資源 ${e.res}`]);if(!EFFECTS[e.t])out.push(['err',`${n}：未知的效果類型 ${e.t}`])});
    if((c.history||'').length>80)out.push(['warn',`${n}：史料文字 ${c.history.length} 字，卡面可能放不下`]);
    if(c.type!=='memory'&&!(c.effects||[]).length&&!String(c.text||'').trim())out.push(['warn',`${n}：沒有效果也沒有規則文字`]);
  });
  DATA.resources.forEach(r=>{if(r.status==='史料'&&!r.source)out.push(['err',`【資源】${r.name}：標為史料，但沒有出處`])});
  if(!projects().length)out.push(['err','沒有任何公共建設卡，共同目標無法達成']);
  if(projects().length&&!projects().some(c=>c.unlockWater))out.push(['warn','沒有任何公共建設會「通水」，水田永遠沒有水']);
  if(!cardsOf('event').length)out.push(['warn','沒有歷史事件卡']);
  return out;
}

function exportCSV(){

  DATA.cards.forEach(c=>rows.push([TYPES[c.type]?TYPES[c.type].label:c.type,c.id,c.name,c.copies,c.status,c.year||'',
    Object.entries(c.cost||{}).filter(([k,v])=>v>0).map(([k,v])=>resName(k)+v).join(' '),(c.requires||[]).map(reqText).join('、'),
    c.type==='memory'?'':ruleText(c),c.then||'',c.now||'',c.history||'',c.source||'']));
  DATA.resources.forEach(r=>rows.push(['資源卡',r.id,r.name,r.copies,r.status,'','','','產自：'+r.tile,'','',r.history,r.source]));
  download('一水千田_卡牌內容.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
}

}

    const k=t.dataset.f;
    if(k==='image'&&t.value==='(已上傳圖片)')return;
    c[k]=t.type==='checkbox'?t.checked:t.type==='number'?(+t.value||0):t.value;save();refreshPreview();return;
  }
  if(t.dataset.cost&&c){const v=+t.value||0;if(v>0)c.cost[t.dataset.cost]=v;else delete c.cost[t.dataset.cost];save();refreshPreview();return}
  if(t.dataset.eff&&c){
    const e=c.effects[+t.dataset.eff];const k=t.dataset.ef;
    if(k==='t'){const old=e;const n={t:t.value};EFFECTS[t.value].p.forEach(p=>{n[p]=old[p]!=null?old[p]:(p==='target'?(c.type==='event'?'all':'self'):p==='res'?DATA.resources[0].id:p==='n'?1:'')});c.effects[+t.dataset.eff]=n;save();render();return}
    e[k]=k==='n'?(+t.value||0):t.value;save();refreshPreview();return;
  }
  if(t.dataset.req&&c){
    const r=c.requires[+t.dataset.req];const k=t.dataset.rf;
    if(k==='k'){r.k=t.value;if(r.k==='water'){delete r.stat;delete r.min}else{r.stat=r.stat||'旱田';r.min=r.min||1}save();render();return}
    r[k]=k==='min'?(+t.value||0):t.value;save();refreshPreview();return;
  }
  if(t.dataset.res!=null&&t.dataset.rf){
    const r=DATA.resources[+t.dataset.res];r[t.dataset.rf]=t.type==='number'?(+t.value||0):t.value;save();
    if(t.type==='color'||t.dataset.rf==='status')render();return;
  }
  if(t.dataset.set){const k=t.dataset.set;const s=S();s[k]=t.type==='checkbox'?t.checked:t.tagName==='SELECT'?t.value:(+t.value||0);save();return}
  if(t.dataset.meta){DATA.meta[t.dataset.meta]=t.value;save();return}
  if(t.dataset.setupName!=null){SETUP.names[+t.dataset.setupName]=t.value;return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.matches('[data-setup-n]')){SETUP.n=+t.value;render();return}
  if(t.dataset.setupRole!=null){SETUP.roles[+t.dataset.setupRole]=t.value;return}
  if(t.dataset.prType){PR.types[t.dataset.prType]=t.checked;render();return}
  if(t.dataset.pr){PR[t.dataset.pr]=t.checked;render();return}
  if(t.dataset.f==='status'||t.dataset.f==='copies'||t.dataset.f==='unlockWater'){render();return}
  if(t.matches('[data-img]')&&t.files[0]){
    const c=cardById(ED.sel);const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const m=480,sc=Math.min(1,m/Math.max(img.width,img.height));const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      c.image=cv.toDataURL('image/jpeg',.85);save();render()};img.src=fr.result};
    fr.readAsDataURL(t.files[0]);return;
  }
  if(t.id==='jsonFile'&&t.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.cards))throw 0;DATA=d;normalize();save();toast('已匯入 '+d.cards.length+' 張卡牌');render()}catch(e){toast('⚠ 這不是正確的卡牌 JSON 檔')}};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.ctrlKey&&ev.shiftKey&&(ev.key==='D'||ev.key==='d')){ev.preventDefault();OVER=OVER==='editor'?null:'editor';render()}
  if(ev.key==='Escape'&&(OVER||MODAL)){if(MODAL)MODAL=null;else OVER=null;render()}
});

/* ================= 啟動 ================= */
const oldDraft=loadData();normalize();
if(location.hash==='#dev')OVER='editor';
if(oldDraft){
  MODAL={saved:oldDraft,html:`<h3>這台電腦有舊的修改草稿</h3><p>這個檔案的內建內容是「${esc(EMBED.meta.version||'')}」，和你上次在這台電腦修改的版本不同（草稿存於 ${esc((oldDraft.saved||'').slice(0,16).replace('T',' '))}）。要用哪一份？</p>
  <div class="row"><button data-act="useEmbed">用這個檔案的內容</button><button class="primary" data-act="useSaved">繼續用我的草稿</button></div>`};
}
render();
</script>
</body>
</html>
